
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login – UniSkill Hub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/teal-theme.css">
  <link rel="stylesheet" href="css/dark-mode-unified.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/theme.js"></script>

  <style>
    .admin-login-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card, #fff);
      border: 1px solid var(--border-color, #dce5e5);
      border-radius: 12px;
      padding: 34px;
      box-shadow: 0 6px 25px rgba(0,0,0,.05);
    }

    .admin-login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .admin-badge-icon {
      font-size: 30px;
      margin-bottom: 14px;
    }

    .admin-login-card .form-group {
      margin-bottom: 20px;
    }

    .admin-login-card .form-control {
      width: 100%;
    }

    .admin-login-alert {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }

    .admin-login-alert.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffcccc;
    }

    .admin-login-alert.success {
      display: block;
      background: #eaf8f1;
      color: #087443;
      border: 1px solid #b7e4cb;
    }

    .admin-submit {
      width: 100%;
      margin-top: 8px;
    }

    .admin-submit:disabled {
      opacity: .65;
      cursor: wait;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-badge">🎓</span>
        <span class="logo-text">
          UniSkill<span>Hub</span>
          <small style="font-size:11px;">
            [ADMIN PORTAL]
          </small>
        </span>
      </a>

      <a href="index.html">
        ← Back to Student Platform
      </a>
    </div>
  </header>

  <main class="admin-login-wrapper">

    <div class="admin-login-card">

      <div class="admin-login-header">
        <div class="admin-badge-icon">🛡️</div>
        <h2>Admin Sign In</h2>
        <p>
          Sign in with your authorized
          UniSkill Hub administrator account.
        </p>
      </div>

      <div
        id="adminLoginAlert"
        class="admin-login-alert"
        role="alert"
        aria-live="polite">
      </div>

      <form id="adminLoginForm">

        <div class="form-group">
          <label class="form-label" for="adminEmail">
            Administrator Email
          </label>

          <input
            type="email"
            id="adminEmail"
            class="form-control"
            placeholder="admin@uniskill.lk"
            autocomplete="username"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">
            Password
          </label>

          <input
            type="password"
            id="adminPassword"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
        </div>

        <button
          type="submit"
          id="adminLoginBtn"
          class="btn btn-primary btn-block admin-submit">
          Sign In to Dashboard
        </button>

      </form>

    </div>

  </main>

  <footer class="footer">
    <div class="footer-content">
      <span>
        © 2026 UniSkill Hub – Administration Console
      </span>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      const form = document.getElementById("adminLoginForm");
      const alertBox = document.getElementById("adminLoginAlert");
      const loginBtn = document.getElementById("adminLoginBtn");

      function showAlert(message, type = "error") {
        alertBox.textContent = message;
        alertBox.className = "admin-login-alert " + type;
      }

      function setLoading(loading) {
        loginBtn.disabled = loading;
        loginBtn.textContent = loading
          ? "Signing in..."
          : "Sign In to Dashboard";
      }

      function getSupabaseClient() {
        // Supports the common client names used by
        // different versions of supabase-config.js.
        const candidates = [
          window.supabaseClient,
          window.supabaseDB,
          window.sb
        ];

        for (const client of candidates) {
          if (
            client &&
            client.auth &&
            typeof client.auth.signInWithPassword === "function" &&
            typeof client.from === "function"
          ) {
            return client;
          }
        }

        return null;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document
          .getElementById("adminEmail")
          .value.trim();

        const password = document
          .getElementById("adminPassword")
          .value;

        const client = getSupabaseClient();

        if (!client) {
          showAlert(
            "Supabase client was not initialized. Check js/supabase-config.js."
          );
          return;
        }

        setLoading(true);
        alertBox.style.display = "none";

        try {
          const { data, error } =
            await client.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {
            throw error;
          }

          if (!data || !data.user) {
            throw new Error(
              "Authentication failed. No user was returned."
            );
          }

          const { data: admin, error: roleError } =
            await client
              .from("faculty_admins")
              .select("role, faculty")
              .eq("user_id", data.user.id)
              .maybeSingle();

          if (roleError) {
            console.error(
              "Admin role verification error:",
              roleError
            );

            throw new Error(
              "Could not verify admin permission. Check the faculty_admins table and its RLS policies."
            );
          }

          const allowedRoles = [
            "super_admin",
            "faculty_admin"
          ];

          if (
            !admin ||
            !allowedRoles.includes(admin.role)
          ) {
            await client.auth.signOut();

            throw new Error(
              "Access denied. This account does not have administrator permission."
            );
          }

          showAlert(
            "Admin login successful. Redirecting...",
            "success"
          );

          window.location.replace("admin-dashboard.html");

        } catch (error) {
          console.error("Admin login error:", error);

          showAlert(
            error.message || "Unable to sign in."
          );

        } finally {
          setLoading(false);
        }
      });

    })();
  </script>

</body>
</html>
